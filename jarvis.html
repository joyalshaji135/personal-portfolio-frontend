<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌍 Route Planner · Leaflet + OSM</title>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Font Awesome (icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #f4f7fc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .app-container {
            max-width: 1200px;
            width: 100%;
            height: 95vh;
            max-height: 900px;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.2s;
        }
        /* header */
        .app-header {
            background: linear-gradient(135deg, #1a2a6c, #2d4373);
            color: white;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .app-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: auto;
        }
        .app-header h1 i {
            color: #ffd966;
        }
        .mode-selector {
            display: flex;
            gap: 6px;
            background: rgba(255,255,255,0.12);
            padding: 4px 8px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }
        .mode-btn {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.7);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mode-btn i {
            font-size: 0.9rem;
        }
        .mode-btn.active {
            background: #ffd966;
            color: #1a2a6c;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .mode-btn:hover {
            color: white;
        }
        .mode-btn.active:hover {
            color: #1a2a6c;
        }
        /* search panel */
        .search-panel {
            padding: 16px 24px;
            background: #f8faff;
            border-bottom: 1px solid #e9edf4;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            position: relative;
        }
        .search-wrapper {
            flex: 2 1 280px;
            position: relative;
        }
        .search-group {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 60px;
            padding: 2px 4px 2px 18px;
            border: 1px solid #dce3ec;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .search-group:focus-within {
            border-color: #1a2a6c;
            box-shadow: 0 4px 12px rgba(26,42,108,0.15);
        }
        .search-group i {
            color: #6b7a93;
            font-size: 0.9rem;
            margin-right: 6px;
        }
        .search-group input {
            border: none;
            padding: 14px 8px 14px 0;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
            background: transparent;
            color: #1e293b;
        }
        .search-group input::placeholder {
            color: #9aa9be;
        }
        /* Suggestions dropdown */
        .suggestions-list {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            max-height: 280px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            border: 1px solid #e9edf4;
            padding: 6px 0;
        }
        .suggestions-list.active {
            display: block;
        }
        .suggestions-list .suggestion-item {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.15s;
            border-bottom: 1px solid #f0f2f6;
        }
        .suggestions-list .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestions-list .suggestion-item:hover {
            background: #f0f4ff;
        }
        .suggestions-list .suggestion-item i {
            color: #6b7a93;
            font-size: 0.9rem;
            width: 18px;
            text-align: center;
        }
        .suggestions-list .suggestion-item .suggestion-name {
            font-weight: 500;
            color: #1e293b;
        }
        .suggestions-list .suggestion-item .suggestion-address {
            font-size: 0.8rem;
            color: #6b7a93;
            margin-left: 4px;
        }
        .suggestions-list .suggestion-item .suggestion-type {
            margin-left: auto;
            font-size: 0.7rem;
            background: #eef2f9;
            padding: 2px 12px;
            border-radius: 20px;
            color: #1a2a6c;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .suggestions-list .suggestion-loading {
            padding: 20px;
            text-align: center;
            color: #6b7a93;
        }
        .suggestions-list .suggestion-loading i {
            margin-right: 8px;
        }
        .action-btn {
            background: #1a2a6c;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(26,42,108,0.25);
            white-space: nowrap;
        }
        .action-btn:hover {
            background: #122252;
            transform: scale(0.97);
        }
        .action-btn i {
            font-size: 1rem;
        }
        .locate-btn {
            background: #eef2f9;
            color: #1a2a6c;
            border: 1px solid #d0dae8;
            padding: 10px 16px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
        }
        .locate-btn:hover {
            background: #dce4f0;
        }
        /* map + info */
        .map-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
        }
        #map {
            flex: 1;
            background: #dce3ec;
        }
        .route-info {
            background: white;
            padding: 14px 24px;
            border-top: 1px solid #e9edf4;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px 20px;
            font-size: 0.95rem;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1e293b;
        }
        .info-item i {
            color: #1a2a6c;
            width: 20px;
            text-align: center;
        }
        .info-item span {
            font-weight: 500;
        }
        .badge {
            background: #eef2f9;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #1a2a6c;
        }
        .leaflet-control-attribution {
            font-size: 9px;
        }
        /* responsive */
        @media (max-width: 700px) {
            .app-header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .app-header h1 {
                margin-right: 0;
                justify-content: center;
            }
            .mode-selector {
                justify-content: center;
            }
            .search-panel {
                flex-direction: column;
                padding: 12px 16px;
            }
            .search-wrapper {
                flex: 1;
                width: 100%;
            }
            .action-btn {
                width: 100%;
                justify-content: center;
            }
            .locate-btn {
                width: 100%;
                justify-content: center;
            }
            .route-info {
                flex-direction: column;
                align-items: flex-start;
                padding: 12px 16px;
            }
            .suggestions-list {
                max-height: 200px;
            }
            .suggestions-list .suggestion-item {
                padding: 10px 16px;
                flex-wrap: wrap;
            }
            .suggestions-list .suggestion-item .suggestion-type {
                margin-left: 0;
                font-size: 0.65rem;
            }
        }
        /* Scrollbar styling */
        .suggestions-list::-webkit-scrollbar {
            width: 6px;
        }
        .suggestions-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .suggestions-list::-webkit-scrollbar-thumb {
            background: #c1c9d6;
            border-radius: 10px;
        }
        .suggestions-list::-webkit-scrollbar-thumb:hover {
            background: #a8b2c2;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- header -->
    <div class="app-header">
        <h1><i class="fas fa-route"></i> RoutePlanner</h1>
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="driving"><i class="fas fa-car"></i> Drive</button>
            <button class="mode-btn" data-mode="walking"><i class="fas fa-walking"></i> Walk</button>
            <button class="mode-btn" data-mode="cycling"><i class="fas fa-bicycle"></i> Bike</button>
        </div>
    </div>

    <!-- search -->
    <div class="search-panel">
        <div class="search-wrapper">
            <div class="search-group">
                <i class="fas fa-magnifying-glass-location"></i>
                <input type="text" id="destinationInput" placeholder="Search for a place..." autocomplete="off" />
            </div>
            <!-- Suggestions dropdown -->
            <div class="suggestions-list" id="suggestionsList">
                <!-- dynamically populated -->
            </div>
        </div>
        <button class="action-btn" id="routeBtn"><i class="fas fa-arrow-right-arrow-left"></i> Get Route</button>
        <button class="locate-btn" id="locateBtn"><i class="fas fa-location-dot"></i> My Location</button>
    </div>

    <!-- map -->
    <div class="map-wrapper">
        <div id="map"></div>
        <div class="route-info" id="routeInfo">
            <div class="info-item"><i class="fas fa-road"></i> Distance: <span id="distanceDisplay">—</span></div>
            <div class="info-item"><i class="far fa-clock"></i> Duration: <span id="durationDisplay">—</span></div>
            <div class="badge"><i class="fas fa-map-pin"></i> Click map to set destination</div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ------------------ CONFIG ------------------
        // Free routing API (OpenRouteService) — get your own key at https://openrouteservice.org/
        const ORS_API_KEY = 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjViNGQyYzk2OTNjNDQ4YzNiNGFkYWRkODdkNmQ2N2U4IiwiaCI6Im11cm11cjY0In0=';
        const ORS_ROUTE_URL = 'https://api.openrouteservice.org/v2/directions/';

        // Map initialization
        const map = L.map('map', {
            center: [51.505, -0.09],
            zoom: 13,
            zoomControl: true,
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19,
        }).addTo(map);

        // UI elements
        const destInput = document.getElementById('destinationInput');
        const routeBtn = document.getElementById('routeBtn');
        const locateBtn = document.getElementById('locateBtn');
        const distanceDisplay = document.getElementById('distanceDisplay');
        const durationDisplay = document.getElementById('durationDisplay');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const suggestionsList = document.getElementById('suggestionsList');

        // State
        let currentMode = 'driving';
        let userMarker = null;
        let destMarker = null;
        let routeLayer = null;
        let userLocation = null;
        let destinationLocation = null;
        let searchTimeout = null;
        let isSearching = false;

        // ---------- Get location suggestions from Nominatim ----------
        async function getSuggestions(query) {
            if (!query || query.length < 2) {
                return [];
            }
            try {
                const resp = await fetch(
                    `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=8&addressdetails=1&polygon_geojson=0&featuretype=settlement&featuretype=city&featuretype=town&featuretype=village&featuretype=suburb&featuretype=district`
                );
                const data = await resp.json();
                return data || [];
            } catch (e) {
                console.error('Suggestions error:', e);
                return [];
            }
        }

        // ---------- Render suggestions dropdown ----------
        function renderSuggestions(suggestions) {
            suggestionsList.innerHTML = '';
            if (!suggestions || suggestions.length === 0) {
                suggestionsList.classList.remove('active');
                return;
            }

            suggestions.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                
                // Get place type
                const type = item.class || 'place';
                const typeIcon = getTypeIcon(type);
                
                // Build display name
                const displayName = item.display_name.split(',')[0] || item.display_name;
                const address = item.display_name.split(',').slice(1).join(',').trim();
                
                div.innerHTML = `
                    <i class="${typeIcon}"></i>
                    <span class="suggestion-name">${displayName}</span>
                    <span class="suggestion-address">${address}</span>
                    <span class="suggestion-type">${type}</span>
                `;
                
                div.addEventListener('click', () => {
                    const lat = parseFloat(item.lat);
                    const lng = parseFloat(item.lon);
                    selectSuggestion(lat, lng, item.display_name);
                });
                
                suggestionsList.appendChild(div);
            });
            
            suggestionsList.classList.add('active');
        }

        // ---------- Get icon for place type ----------
        function getTypeIcon(type) {
            const icons = {
                'city': 'fas fa-city',
                'town': 'fas fa-building',
                'village': 'fas fa-home',
                'suburb': 'fas fa-location-dot',
                'district': 'fas fa-map-pin',
                'settlement': 'fas fa-map-marker-alt',
                'amenity': 'fas fa-store',
                'shop': 'fas fa-shopping-bag',
                'tourist': 'fas fa-landmark',
                'place': 'fas fa-map-marker-alt',
                'building': 'fas fa-building',
                'road': 'fas fa-road',
                'leisure': 'fas fa-tree',
                'sport': 'fas fa-futbol'
            };
            return icons[type] || icons.place;
        }

        // ---------- Select a suggestion ----------
        function selectSuggestion(lat, lng, name) {
            destInput.value = name;
            destinationLocation = { lat, lng };
            setDestinationMarker(lat, lng, name);
            map.setView([lat, lng], 14);
            suggestionsList.classList.remove('active');
            
            if (userLocation) {
                planRoute();
            } else {
                clearRoute();
                distanceDisplay.textContent = '📍 set location first';
            }
        }

        // ---------- Handle input for suggestions ----------
        function handleInput() {
            const query = destInput.value.trim();
            
            // Clear previous timeout
            if (searchTimeout) {
                clearTimeout(searchTimeout);
                searchTimeout = null;
            }
            
            // Close suggestions if query is too short
            if (query.length < 2) {
                suggestionsList.classList.remove('active');
                return;
            }
            
            // Show loading state
            suggestionsList.innerHTML = `
                <div class="suggestion-loading">
                    <i class="fas fa-spinner fa-spin"></i> Searching...
                </div>
            `;
            suggestionsList.classList.add('active');
            
            // Debounce search
            searchTimeout = setTimeout(async () => {
                const results = await getSuggestions(query);
                renderSuggestions(results);
            }, 300);
        }

        // ---------- Close suggestions on outside click ----------
        document.addEventListener('click', function(e) {
            const wrapper = document.querySelector('.search-wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                suggestionsList.classList.remove('active');
            }
        });

        // ---------- Reverse geocode (Nominatim) ----------
        async function reverseGeocode(lat, lng) {
            try {
                const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&zoom=16&addressdetails=1`);
                const data = await resp.json();
                if (data && data.display_name) return data.display_name;
                return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            } catch {
                return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            }
        }

        // ---------- Forward geocode (Nominatim) ----------
        async function geocode(query) {
            try {
                const resp = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`);
                const data = await resp.json();
                if (data && data.length > 0) {
                    return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                }
                return null;
            } catch {
                return null;
            }
        }

        // ---------- Fetch route from OpenRouteService ----------
        async function fetchRoute(startLng, startLat, endLng, endLat, profile = 'driving-car') {
            const url = `${ORS_ROUTE_URL}${profile}?api_key=${ORS_API_KEY}&start=${startLng},${startLat}&end=${endLng},${endLat}&geometry=true&instructions=false`;
            try {
                const resp = await fetch(url);
                if (!resp.ok) {
                    const errText = await resp.text();
                    throw new Error(`ORS error ${resp.status}: ${errText}`);
                }
                return await resp.json();
            } catch (e) {
                console.error('Route fetch error:', e);
                throw e;
            }
        }

        // ---------- Draw route on map ----------
        function drawRoute(geojson) {
            if (routeLayer) {
                map.removeLayer(routeLayer);
                routeLayer = null;
            }
            if (!geojson || !geojson.features || geojson.features.length === 0) return;

            const coords = geojson.features[0].geometry.coordinates;
            const latlngs = coords.map(coord => [coord[1], coord[0]]);
            routeLayer = L.polyline(latlngs, {
                color: '#1a2a6c',
                weight: 6,
                opacity: 0.8,
                smoothFactor: 1.2,
            }).addTo(map);

            const bounds = L.latLngBounds(latlngs);
            map.fitBounds(bounds, { padding: [50, 50] });
        }

        // ---------- Update distance/duration ----------
        function updateInfo(data) {
            if (data && data.features && data.features.length > 0) {
                const props = data.features[0].properties;
                const segments = props.segments || [];
                if (segments.length > 0) {
                    const dist = segments.reduce((sum, seg) => sum + (seg.distance || 0), 0);
                    const dur = segments.reduce((sum, seg) => sum + (seg.duration || 0), 0);
                    const distKm = (dist / 1000).toFixed(1);
                    const durMin = Math.round(dur / 60);
                    distanceDisplay.textContent = distKm + ' km';
                    durationDisplay.textContent = durMin + ' min';
                    return;
                }
            }
            distanceDisplay.textContent = '—';
            durationDisplay.textContent = '—';
        }

        // ---------- Clear route ----------
        function clearRoute() {
            if (routeLayer) {
                map.removeLayer(routeLayer);
                routeLayer = null;
            }
            distanceDisplay.textContent = '—';
            durationDisplay.textContent = '—';
        }

        // ---------- Set destination marker ----------
        function setDestinationMarker(lat, lng, label = 'Destination') {
            if (destMarker) {
                map.removeLayer(destMarker);
                destMarker = null;
            }
            destMarker = L.marker([lat, lng], {
                icon: L.divIcon({
                    html: `<i class="fas fa-map-pin" style="color:#d0314e; font-size:28px; text-shadow: 0 2px 6px rgba(0,0,0,0.3);"></i>`,
                    iconSize: [28, 40],
                    className: 'custom-marker',
                }),
                draggable: false,
            }).addTo(map);
            destMarker.bindPopup(label);
        }

        // ---------- Set user marker ----------
        function setUserMarker(lat, lng) {
            if (userMarker) {
                map.removeLayer(userMarker);
                userMarker = null;
            }
            userMarker = L.marker([lat, lng], {
                icon: L.divIcon({
                    html: `<i class="fas fa-circle" style="color:#1a73e8; font-size:22px; text-shadow: 0 0 8px rgba(26,115,232,0.5);"></i>`,
                    iconSize: [22, 22],
                    className: 'custom-marker',
                }),
                draggable: false,
            }).addTo(map);
            userMarker.bindPopup('📍 You are here');
        }

        // ---------- Plan route ----------
        async function planRoute() {
            if (!userLocation) {
                alert('Please get your current location first (click "My Location").');
                return;
            }
            if (!destinationLocation) {
                alert('Please set a destination (search or click on map).');
                return;
            }

            const profileMap = {
                'driving': 'driving-car',
                'walking': 'foot-walking',
                'cycling': 'cycling-regular'
            };
            const profile = profileMap[currentMode] || 'driving-car';

            const start = userLocation;
            const end = destinationLocation;

            try {
                const data = await fetchRoute(start.lng, start.lat, end.lng, end.lat, profile);
                drawRoute(data);
                updateInfo(data);
            } catch (err) {
                alert('Route error: ' + err.message);
                clearRoute();
            }
        }

        // ---------- Locate user ----------
        function locateUser() {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser.');
                return;
            }
            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    const { latitude, longitude } = pos.coords;
                    userLocation = { lat: latitude, lng: longitude };
                    setUserMarker(latitude, longitude);
                    map.setView([latitude, longitude], 15);
                    const placeName = await reverseGeocode(latitude, longitude);
                    if (userMarker) {
                        userMarker.bindPopup(`📍 ${placeName}`);
                    }
                },
                (err) => {
                    alert('Unable to retrieve location. Please allow location access or enter destination manually.');
                    console.warn(err);
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // ---------- Handle destination search ----------
        async function handleDestinationSearch() {
            const query = destInput.value.trim();
            if (!query) {
                alert('Please enter a destination.');
                return;
            }
            const result = await geocode(query);
            if (!result) {
                alert('Destination not found. Please try another name.');
                return;
            }
            destinationLocation = { lat: result.lat, lng: result.lng };
            setDestinationMarker(result.lat, result.lng, query);
            map.setView([result.lat, result.lng], 14);
            suggestionsList.classList.remove('active');
            if (userLocation) {
                await planRoute();
            } else {
                clearRoute();
                distanceDisplay.textContent = '📍 set location first';
            }
        }

        // ---------- Map click ----------
        function onMapClick(e) {
            const { lat, lng } = e.latlng;
            destinationLocation = { lat, lng };
            reverseGeocode(lat, lng).then(name => {
                setDestinationMarker(lat, lng, name);
                destInput.value = name;
                if (userLocation) {
                    planRoute();
                } else {
                    clearRoute();
                    distanceDisplay.textContent = '📍 get location first';
                }
            }).catch(() => {
                setDestinationMarker(lat, lng, 'Destination');
                destInput.value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                if (userLocation) {
                    planRoute();
                } else {
                    clearRoute();
                    distanceDisplay.textContent = '📍 get location first';
                }
            });
        }

        // ---------- Event listeners ----------
        routeBtn.addEventListener('click', handleDestinationSearch);
        locateBtn.addEventListener('click', locateUser);

        // Input event for suggestions
        destInput.addEventListener('input', handleInput);

        // Keyboard navigation for suggestions
        destInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                // If suggestions are visible and there's a first item, select it
                const firstItem = suggestionsList.querySelector('.suggestion-item');
                if (firstItem && suggestionsList.classList.contains('active')) {
                    firstItem.click();
                } else {
                    handleDestinationSearch();
                }
            }
            if (e.key === 'Escape') {
                suggestionsList.classList.remove('active');
                destInput.blur();
            }
        });

        // Mode switching
        modeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                modeBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentMode = this.dataset.mode;
                if (userLocation && destinationLocation) {
                    planRoute();
                }
            });
        });

        // Map click
        map.on('click', onMapClick);

        // Initial locate
        locateUser();
        map.setView([51.505, -0.09], 13);

        console.log('🌍 Route Planner ready with suggestions.');
    })();
</script>
</body>
</html>
